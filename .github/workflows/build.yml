name: Build

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:
  pull_request_review:
    types: [submitted]

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request_review' || github.event.review.state == 'approved'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: thumbv6m-none-eabi
          components: clippy, llvm-tools

      - name: Install cargo-binutils (rust-objcopy)
        run: cargo install cargo-binutils

      - name: Run clippy (application)
        run: cargo clippy -- -D warnings

      - name: Run clippy (bootloader)
        run: cd bootloader && cargo clippy --release -- -D warnings

      - name: Build and package UF2 (dev profile with debug logging)
        run: ./package.sh debug

      - name: Verify build artifacts
        run: |
          echo "Build artifacts (dev profile with debug logging):"
          ls -la target/thumbv6m-none-eabi/debug/jetkvm-dc-extension
          ls -la bootloader/target/thumbv6m-none-eabi/release/jetkvm-dc-bootloader
          ls -la jetkvm-dc-combined.uf2 jetkvm-dc-extension.bin jetkvm-dc-extension.bin.crc32

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jetkvm-dc-extension-debug-${{ github.sha }}
          path: |
            jetkvm-dc-combined.uf2
            jetkvm-dc-extension.bin
            jetkvm-dc-extension.bin.crc32
          retention-days: 30
